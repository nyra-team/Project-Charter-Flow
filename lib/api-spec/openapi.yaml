            type: integer
      responses:
        "200":
          description: Charter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charter"
        "404":
          description: Not found
    patch:
      operationId: updateCharter
      tags: [charters]
      summary: Update a charter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
