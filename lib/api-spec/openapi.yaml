openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Project Hub API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: charters
    description: Project charter operations
  - name: approvals
    description: Approval workflow operations
  - name: projects
    description: Project management operations
  - name: tasks
    description: Task operations
  - name: milestones
    description: Milestone operations
  - name: dashboard
    description: Dashboard and analytics
  - name: portfolios
    description: Portfolio management
  - name: programs
    description: Program management
  - name: workstreams
    description: Workstream management
  - name: project_stages
    description: Project lifecycle stage tracking
  - name: documents
    description: Document repository
  - name: issues
    description: Issue tracking
  - name: messages
    description: In-app communications
  - name: resources
    description: Resource allocations and RACI
  - name: budget
    description: Budget line management
  - name: escalation
    description: Escalation rules
  - name: scoring
    description: Project scoring
  - name: notifications
    description: Notification management
  - name: storage
    description: Object storage upload and serving endpoints

paths:
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /charters:
    get:
      operationId: listCharters
      tags: [charters]
      summary: List all project charters
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
